<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Картинки подсказок — Historical Timeline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #12121c; color: #eee; }
    header { position: sticky; top: 0; z-index: 2; background: #1a1a2e; border-bottom: 1px solid #2e2e48; padding: 14px 16px 12px; }
    h1 { font-size: 1.15rem; margin: 0 0 6px; }
    p { margin: 0; color: #b7b7cc; font-size: 0.86rem; line-height: 1.4; }
    a { color: #f0c36a; }
    .tools { display: flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; background: #12121c; color: #fff; border: 1px solid #3a3a55; border-radius: 10px; padding: 10px 12px; font-size: 16px; }
    #count { align-self: center; color: #9a9ab0; font-size: 0.8rem; white-space: nowrap; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; padding: 12px; }
    article { background: #1c1c30; border: 1px solid #2e2e48; border-radius: 12px; overflow: hidden; }
    figure { margin: 0; background: #f3efe6; height: 140px; display: flex; align-items: center; justify-content: center; }
    img { max-width: 100%; max-height: 140px; object-fit: contain; display: block; }
    .meta { padding: 8px 10px 10px; }
    .year { color: #f0c36a; font-size: 0.75rem; font-weight: 700; }
    .title { font-size: 0.86rem; line-height: 1.3; margin: 2px 0 6px; }
    code { display: block; font-size: 0.68rem; color: #9ad; word-break: break-all; }
    .err { padding: 24px; color: #f88; }
  </style>
</head>
<body>
  <header>
    <h1>Картинки подсказок</h1>
    <p>У каждого события свой файл. Чтобы заменить картинку, положи новый файл с <strong>тем же именем</strong> в папку <code>images</code> и обнови страницу (Ctrl+Shift+R). Игра берёт путь из <code>events.json</code>, поле <code>image</code>.</p>
    <div class="tools">
      <input id="q" type="search" placeholder="Название или имя файла" autocomplete="off" />
      <span id="count"></span>
    </div>
    <p style="margin-top:8px"><a href="index.html">← К игре</a></p>
  </header>
  <main id="grid"></main>
  <script>
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const count = document.getElementById('count');
    let events = [];
    function yearLabel(y) {
      if (y < 0) return Math.abs(y) + ' до н.э.';
      return String(y);
    }
    function render() {
      const s = q.value.trim().toLowerCase();
      const list = events.filter(e => !s || (e.title + ' ' + e.id + ' ' + e.image).toLowerCase().includes(s));
      count.textContent = list.length + ' / ' + events.length;
      grid.innerHTML = list.map(e => {
        const file = (e.image || '').split('/').pop();
        const src = e.image || '';
        return '<article><figure><img src="' + src.replace(/"/g, '') + '" alt=""></figure><div class="meta"><div class="year">' + yearLabel(e.year) + '</div><div class="title">' + e.title.replace(/[&<>]/g, c => ({'&':'&','<':'<','>':'>'}[c])) + '</div><code>' + file + '</code></div></article>';
      }).join('');
    }
    fetch('events.json').then(r => r.json()).then(data => {
      events = data.slice().sort((a, b) => a.year - b.year);
      render();
    }).catch(err => {
      grid.innerHTML = '<p class="err">Не удалось загрузить events.json</p>';
      console.error(err);
    });
    q.addEventListener('input', render);
  </script>
</body>
</html>
